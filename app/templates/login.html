<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ICIKIWIR SHOWROOM</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;800;900&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #0c0d0e;
            background-image: radial-gradient(circle at 12% 18%, rgba(255, 255, 255, 0.12) 0%, transparent 45%);
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Poppins", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            padding: 20px;
        }

        /* Container utama pembagi 2 kolom */
        .main-container {
            width: 100%;
            max-width: 1200px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            min-height: 600px;
        }

        /* CARD GLASSMORPHISM (SEBELAH KIRI) */
        .glass-card {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 24px;
            padding: 45px 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8);
            z-index: 10;
        }

        .glass-card h2 {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-align: center;
            margin-bottom: 6px;
            color: #ffffff;
        }

        .glass-card p.subtitle {
            color: #999999;
            font-size: 0.9rem;
            text-align: center;
            margin-bottom: 35px;
        }

        /* Input Custom Oval */
        .custom-input {
            background: rgba(35, 35, 38, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 30px;
            color: #ffffff;
            padding: 14px 22px;
            font-size: 0.9rem;
            width: 100%;
            margin-bottom: 18px;
            transition: all 0.3s ease;
        }

        .custom-input:focus {
            background: rgba(45, 45, 50, 0.95);
            border-color: rgba(255, 255, 255, 0.3);
            color: #ffffff;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.1);
            outline: none;
        }

        .custom-input::placeholder {
            color: #666666;
        }

        .forgot-link {
            display: block;
            text-align: right;
            color: #777777;
            font-size: 0.8rem;
            text-decoration: none;
            margin-top: -6px;
            margin-bottom: 25px;
            transition: color 0.2s;
        }

        .forgot-link:hover {
            color: #cccccc;
        }

        /* Tombol Login Oval Terang */
        .btn-submit {
            background-color: #e2e2e2;
            color: #0d0d0d;
            font-weight: 800;
            border-radius: 30px;
            padding: 12px 36px;
            border: none;
            font-size: 0.85rem;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .btn-submit:hover {
            background-color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 255, 255, 0.25);
        }

        .divider {
            border-top: 1px solid rgba(255, 255, 255, 0.12);
            margin: 32px 0 22px 0;
        }

        .signup-text {
            text-align: center;
            font-size: 0.85rem;
            color: #888888;
        }

        .signup-text a {
            color: #ffffff;
            font-weight: 800;
            text-decoration: none;
            margin-left: 6px;
        }

        .signup-text a:hover {
            text-decoration: underline;
        }

        /* SHOWCASE KENDARAAN (SEBELAH KANAN) */
        .showcase-wrapper {
            flex: 1;
            position: relative;
            height: 520px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-left: 20px;
        }

        /* Gambar Motor (PNG Transparan) */
        .img-bike {
            position: absolute;
            top: -25px;
            right: 300px;
            width: 400px;
            max-width: 100%;
            z-index: 1;
            filter: drop-shadow(0 15px 25px rgba(0, 0, 0, 0.95));
            transition: transform 0.3s ease;
        }

        /* Gambar Mobil (PNG Transparan) */
        .img-car {
            position: absolute;
            bottom: 0px;
            right: 20px;
            width: 900px;
            max-width: 200%;
            z-index: 2;
            filter: drop-shadow(0 25px 35px rgba(0, 0, 0, 0.98));
            transition: transform 0.3s ease;
        }

        /* Tombol Back Kiri Bawah */
        .btn-back {
            position: fixed;
            bottom: 25px;
            left: 25px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #ffffff;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            transition: all 0.3s;
            z-index: 100;
        }

        .btn-back:hover {
            background: rgba(255, 255, 255, 0.2);
            color: #ffffff;
            transform: translateX(-3px);
        }

        /* Responsive untuk Layar HP / Tablet */
        @media (max-width: 991px) {
            .showcase-wrapper {
                display: none;
            }
            .main-container {
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <!-- Tombol Kembali ke Beranda (Kiri Bawah) -->
    <a href="{{ url_for('dashboard') }}" class="btn-back" title="Kembali ke Beranda">
        <i class="bi bi-box-arrow-left fs-5"></i>
    </a>

    <div class="main-container">

        <!-- Flash Messages (Notifikasi) -->
        <div class="position-absolute top-0 start-50 translate-middle-x mt-2" style="z-index: 100; width: 90%; max-width: 420px;">
            {% with messages = get_flashed_messages(with_categories=true) %}
              {% if messages %}
                {% for category, message in messages %}
                  <div class="alert alert-{{ category }} alert-dismissible fade show bg-dark text-white border-secondary shadow" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert"></button>
                  </div>
                {% endfor %}
              {% endif %}
            {% endwith %}
        </div>

        <!-- FORM LOGIN GLASSMORPHISM (KIRI) -->
        <div class="glass-card">
            <h2>WELCOME!</h2>
            <p class="subtitle">Sign in to your account</p>

            <form action="{{ url_for('login') }}" method="POST" autocomplete="off">
                <input type="text" class="custom-input" name="identifier" placeholder="Enter your email address" autocomplete="new-text" required>
                <input type="password" class="custom-input" name="password" placeholder="Password" autocomplete="new-password" required>
                
                <a href="#" class="forgot-link">Forgot Password?</a>

                <button type="submit" class="btn-submit">LOGIN</button>
            </form>

            <div class="divider"></div>

            <div class="signup-text">
                don't have an account? <a href="{{ url_for('register') }}">Sign up</a>
            </div>
        </div>

        <!-- GAMBAR MOTOR & MOBIL PNG TRANSPARAN (KANAN) -->
        <div class="showcase-wrapper">
            <!-- Motor Hitam Sport -->
            <img src="https://user44523.na.imgto.link/public/20261013/c053e2da4a93d390ab3c71fc-motor.avif" class="img-bike" alt="Superbike Hitam">
            <!-- Mobil Sport Hitam -->
            <img src="https://user44523.na.imgto.link/public/20261013/df2cd228feb0ee2f8e4e8a8f-mclaren-1.avif" class="img-car" alt="Supercar Hitam">
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
