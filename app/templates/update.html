<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Kendaraan - ICIKIWIR SHOWROOM</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm border-0 rounded-3">
                    <div class="card-header bg-dark text-white fw-bold">
                        Edit Unit {{ 'Mobil' if type == 'car' else 'Motor' }}
                    </div>
                    <div class="card-body">
                        <form action="{{ url_for('edit_vehicle', type=type, item_id=item.id) }}" method="POST">
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Nama / Judul Kendaraan</label>
                                <input type="text" name="title" class="form-control" value="{{ item.title }}" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Harga (Rp)</label>
                                <input type="number" name="price" class="form-control" value="{{ item.price }}" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">URL Gambar</label>
                                <input type="text" name="image_url" class="form-control" value="{{ item.image_url }}">
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-semibold">Status Kendaraan</label>
                                <select name="status" class="form-select">
                                    <option value="available" {% if item.status == 'available' %}selected{% endif %}>Tersedia (Available)</option>
                                    <option value="sold" {% if item.status == 'sold' %}selected{% endif %}>Terjual (Sold)</option>
                                </select>
                            </div>
                            <div class="d-flex justify-content-end gap-2">
                                <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">Batal</a>
                                <button type="submit" class="btn btn-primary fw-bold">Simpan Perubahan</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
